 `<p>Data export includes values, units, methods and source labels.</p><div class="chips"><button class="btn pri" data-act="repCsv">Build CSV</button></div>${R.csv?`<label class="f" style="margin-top:8px">CSV (select and copy)<textarea id="f-rep-csv" readonly style="font-family:var(--mono);font-size:12px;min-height:140px">${esc(R.csv)}</textarea></label>`:''}<div class="muted" style="margin-top:8px;font-size:12px">The preview on the right is the report. PDF export is not available in this prototype.</div>`][R.step-1];
 return `<div class="head"><div><h1>Technical reporting</h1><p>Assemble a consulting report from verified platform records. Charts, tables and counts come from the data. Findings and recommendations are written by you.</p></div></div>

function repDoc(pks){
 const R=S.rep,locs=R.locs.filter(id=>P[id]),from=Math.min(R.from,R.to),to=Math.max(R.from,R.to),per=MN.slice(from,to+1);
 const rows=[];locs.forEach(id=>pks.forEach(pk=>{const s=M[id][pk].slice(from,to+1),v=nn(s);rows.push({id,pk,n:v.length,exp:s.length,mean:mean(v),min:v.length?Math.min(...v):null,max:v.length?Math.max(...v):null,last:v.length?v[v.length-1]:null})}));
 const miss=rows.reduce((a,r)=>a+(r.exp-r.n),0),lg=LEG.filter(l=>locs.includes(l.loc)&&l.m>=from&&l.m<=to),lgr=lg.filter(l=>l.res!=='Pending');
 const first=pks[0],series=first?locs.map((id,i)=>({name:id,v:M[id][first].slice(from,to+1)})):[];

 <h1 style="margin-top:14px">${esc(R.type)}</h1><p class="muted">${esc(R.client)} · ${esc(R.sys)} · ${MFULL[from]} to ${MFULL[to]}</p><p><strong>Simulated demo data.</strong> No value in this report is a real measurement.</p>

 <h2>Sampling methodology</h2><p>${pks.map(k=>`${PARAMS[k].name}: ${PARAMS[k].method}`).join('; ')||'No parameters selected.'}. Laboratories: Riverbend Reference Lab and Northgate Analytical (simulated).</p>
 <h2>Results</h2>${rows.length?`<div class="tw"><table><thead><tr><th>Location</th><th>Parameter</th><th class="num-r">n/expected</th><th class="num-r">Mean</th><th class="num-r">Min</th><th class="num-r">Max</th><th class="num-r">Latest</th><th>Unit</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${r.id}</td><td>${PARAMS[r.pk].name.replace('Assimilable organic carbon','AOC').replace('Free chlorine residual','Free chlorine')}</td><td class="num-r">${r.n}/${r.exp}</td><td class="num-r">${f(r.mean,PARAMS[r.pk].dec+1)}</td><td class="num-r">${f(r.min,PARAMS[r.pk].dec)}</td><td class="num-r">${f(r.max,PARAMS[r.pk].dec)}</td><td class="num-r">${f(r.last,PARAMS[r.pk].dec)}</td><td>${PARAMS[r.pk].unit}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Select locations and parameters in step 3.</p>'}
 ${first&&series.length?`<h2>Data analysis</h2><p class="muted">${PARAMS[first].name} (${PARAMS[first].unit}) by month</p>${lineChart({labels:per,series,dec:PARAMS[first].dec,h:200,unit:PARAMS[first].unit})}<div class="legend">${series.map((s,i)=>`<span><i class="sw" style="background:var(--c${i%3+1})"></i>${s.name}</span>`).join('')}</div>`:''}
 ${R.leg?`<h2>Legionella monitoring</h2><p>${lg.length} samples collected at the selected locations in the period; ${lgr.length} resulted, ${lgr.filter(l=>l.res==='Detected').length} with a detection recorded. Interpretation is left to the reviewing specialist.</p>`:''}
 <h2>Limitations</h2><ul><li>Demo data are simulated and unvalidated.</li><li>${miss} expected observation${miss===1?'':'s'} missing in the selected records.</li><li>No regulatory limits or risk scores are applied.</li></ul>
 <h2>Technical findings and recommendations</h2>${R.findings?`<p style="white-space:pre-wrap">${esc(R.findings)}</p>`:'<p class="muted">Not yet written.</p>'}
 <h2>References</h2>${R.refs?`<p style="white-space:pre-wrap">${esc(R.refs)}</p>`:'<p class="muted">No references supplied.</p>'}
 <h2>Appendix</h2><p class="muted">Data source: AquaTrace demo dataset. Units and methods as listed. Report version 0.${ap?2:1}.</p></div>`}

  <button class="opt" data-act="startPick" data-v="report"><small>Finished output</small><b>Sample report</b><span>See a technical report assembled from the records, pending approval.</span></button></div>

 return `<div class="start">${RINGS}<div class="sin"><div class="stop">${logo}<div class="dots" aria-label="Step ${st+1} of 3">${dots}</div></div><div class="smain">${b}</div><div class="sfoot">Concept prototype using simulated data. It is not a system requested or used by Dr. Water Consulting.</div></div></div>`}

function render(keepScroll){
 const ae=document.activeElement,fid=ae&&ae.id,ss=ae&&ae.selectionStart,se=ae&&ae.selectionEnd,sy=window.scrollY;

 if(S.start<3){app.className='';app.innerHTML=vStart();renderOverlay();const e0=fid&&document.getElementById(fid);if(e0)e0.focus();return}

 else{app.querySelectorAll('.nav[data-v]').forEach(b=>{b.toggleAttribute('aria-current',b.dataset.v===S.screen);if(b.dataset.v===S.screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}

 $('#screen').innerHTML=v;
 $('#screen').querySelectorAll('[data-path]').forEach(e=>{if(!e.id)e.id='f-'+e.dataset.path.replace(/\./g,'-')});
 const tabs=document.querySelectorAll('.tab');
 afterRender();renderOverlay();
 if(fid){const e=document.getElementById(fid);if(e){e.focus();try{if(ss!=null)e.setSelectionRange(ss,se)}catch(x){}}}

}
function afterRender(){
 if(S.screen==='overview'&&S.anim){S.anim=false;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('.count').forEach(el=>{const t=+el.dataset.v;if(rm){el.textContent=t;return}const t0=performance.now();(function s(now){const p=Math.min(1,(now-t0)/700);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(s)})(t0)})}
 const svg=$('#mapsvg');if(svg){const vp=$('#vp');let drag=null,moved=false;const v=S.map.v;
  const apply=()=>vp.setAttribute('transform',`translate(${v.x} ${v.y}) scale(${v.k})`);
  svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:v.x,vy:v.y};moved=false});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),sc=820/r.width,dx=(e.clientX-drag.x)*sc,dy=(e.clientY-drag.y)*sc;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){v.x=drag.vx+dx;v.y=drag.vy+dy;apply()}});
  const end=()=>{drag=null;setTimeout(()=>{svg._moved=moved},0)};svg.addEventListener('pointerup',end);svg.addEventListener('pointerleave',end);
  svg.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:.87,e.clientX,e.clientY)},{passive:false});}
}
function zoomAt(fac,cx,cy){const svg=$('#mapsvg'),v=S.map.v,r=svg.getBoundingClientRect(),sc=820/r.width;
 const px=cx==null?410:(cx-r.left)*sc,py=cy==null?230:(cy-r.top)*sc,nk=Math.max(.8,Math.min(4,v.k*fac)),k=nk/v.k;
 v.x=px-(px-v.x)*k;v.y=py-(py-v.y)*k;v.k=nk;$('#vp').setAttribute('transform',`translate(${v.x} ${v.y}) scale(${v.k})`)}

 case'startSkip':S.start=3;go('overview');break;
 case'startShow':S.start=0;S.ack=false;render();window.scrollTo(0,0);break;
 case'startPick':S.start=3;if(v==='tour'){S.tour=0;TOUR[0].run();location.hash=S.screen;render();window.scrollTo(0,0)}else if(v==='map'){S.map.sel='SP-12';go('map')}else if(v==='report'){S.rep.step=6;go('report')}else go('overview');break;
 }});
function onInput(e){const el=e.target;if(el.dataset.act==='file'){S.lab.impFile=el.files[0]?el.files[0].name:'';S.lab.imp=S.lab.impFile?1:0;render(true);return}
 const p=el.dataset.path;if(!p)return;let v=el.type==='checkbox'?el.checked:el.value;if(el.type==='range'||el.dataset.num)v=+v;
 if(['map.m','map.cmp','rep.from','rep.to'].includes(p))v=+v;
 setPath(S,p,v);if(p==='lab.q'||p==='lab.param'||p==='lab.loc'||p==='lab.status'||p==='lab.issues')S.lab.page=0;
 if(p==='map.m'&&el.type==='range'){render(true);return}
 render(true)}
document.addEventListener('input',onInput);document.addEventListener('change',e=>{if(e.target.dataset.act==='file')onInput(e)});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(SCREENS.some(s=>s[0]===h)&&h!==S.screen){S.screen=h;S.anim=h==='overview';render();window.scrollTo(0,0)}});
{const h=location.hash.slice(1);if(SCREENS.some(s=>s[0]===h))S.screen=h}
render();
